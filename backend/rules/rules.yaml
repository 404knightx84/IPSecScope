version: 1
note: >
  Thresholds follow RFC 8221 (ESP), RFC 8247 (IKEv2), RFC 9395 (IKEv1 deprecation) and NIST SP 800-77r1.
  The lifetime threshold is a policy default. Verify each threshold against the current text before the final report.
severity_weights: {critical: 25, high: 15, medium: 8, low: 3, informational: 0, none: 0}
risk_bands:            # first match wins, applied to the 0-100 security score (higher is better)
  - {min: 80, level: Low}
  - {min: 60, level: Medium}
  - {min: 40, level: High}
  - {min: 0, level: Critical}
floor: {critical: Critical, high: High}     # any Critical finding means Critical, any High means at least High
threats:                                    # likelihood and impact on a 1-3 grid (Low, Medium, High)
  T1: {name: Offline cracking of the pre-shared key, likelihood: 3, impact: 3}
  T2: {name: Exposure of a deprecated protocol, likelihood: 2, impact: 2}
  T3: {name: "Decryption through weak primitives (small DH group, 3DES)", likelihood: 2, impact: 3}
  T4: {name: Retrospective decryption after a key compromise, likelihood: 2, impact: 3}
  T5: {name: Replay or injection (not verifiable from a passive capture), likelihood: 1, impact: 2}
  T6: {name: Traffic analysis and metadata leakage, likelihood: 3, impact: 1}
  T7: {name: Long-lived keys widen the exposure window, likelihood: 1, impact: 2}
rules:
  - id: R01
    name: IKEv1 in use
    item: ike_version
    when: {op: eq, value: IKEv1}
    severity: high
    worst_case_severity: medium
    fix: Migrate the tunnel to IKEv2.
    reference: RFC 9395 (IKEv1 moved to Historic)
    threat: T2
  - id: R02
    name: IKEv1 Aggressive Mode exposes identity and a PSK hash
    item: ike_mode
    when: {op: eq, value: Aggressive Mode}
    severity: high
    worst_case_severity: medium
    fix: Use IKEv2, or Main Mode with a strong random PSK or certificates.
    reference: NIST SP 800-77r1 (IKEv1 modes); RFC 9395
    threat: T1
  - id: R03
    name: Weak ESP encryption (3DES)
    item: cipher_family
    when: {op: any_regex, field: group, value: '3DES'}
    conf_field: p_3des
    severity: high
    worst_case_severity: medium
    fix: Use AES-GCM (preferred) or AES-CBC with HMAC-SHA2.
    reference: RFC 8221 (ENCR_3DES is SHOULD NOT)
    threat: T3
  - id: R04
    name: Weak IKE SA encryption (DES or 3DES)
    item: ike_encryption
    when: {op: regex, value: '3DES|(^|_)DES(_|$)'}
    severity: medium
    worst_case_severity: medium
    fix: Use AES-256 or AES-GCM for the IKE SA.
    reference: RFC 8247 (ENCR_3DES is MAY, DES is not allowed)
    threat: T3
  - id: R05
    name: Small Diffie-Hellman group
    item: dh_group
    when: {op: regex, value: '^MODP_(768|1024|1536)$|^(1|2|5)$'}
    severity: high
    worst_case_severity: medium
    fix: Use group 14 (2048-bit) or larger, or an elliptic-curve group such as 19.
    reference: RFC 8247 (group 1 MUST NOT, groups 2 and 5 SHOULD NOT)
    threat: T3
  - id: R06
    name: No perfect forward secrecy on the child SA
    item: pfs
    when: {op: eq, value: 'off'}
    severity: medium
    worst_case_severity: medium
    fix: Add a DH group to the child SA proposal.
    reference: NIST SP 800-77r1 (PFS recommended)
    threat: T4
  - id: R07
    name: Child SA lifetime too long
    item: child_sa_lifetime
    when: {op: gt, field: seconds, value: 28800}
    severity: low
    worst_case_severity: none      # skipped when no rekey was seen
    fix: Shorten the child SA lifetime (hours, not days).
    reference: NIST SP 800-77r1 (lifetime guidance; threshold is a policy default)
    threat: T7
  - id: R08
    name: CBC with HMAC instead of an AEAD cipher
    item: cipher_family
    when: {op: eq, value: 'CBC+HMAC'}
    severity: low
    worst_case_severity: low
    fix: Prefer AES-GCM.
    reference: RFC 8221 (AES-GCM and AES-CBC are both MUST; AEAD preferred)
    threat: T3
  - id: R09
    name: Replay protection not evidenced (passive)
    item: null
    severity: informational
    fix: Verify the anti-replay window on the gateway. A passive capture cannot show enforcement.
    reference: RFC 4303 (sequence number and replay window)
    threat: T5
  - id: R10
    name: Transport mode exposes the original endpoints
    item: tunnel_mode
    when: {op: eq, value: transport}
    severity: low
    worst_case_severity: none
    fix: Use tunnel mode when the endpoints must stay hidden.
    reference: RFC 4301 (modes)
    threat: T6
  - id: R11
    name: Traffic type can be inferred from ESP metadata
    item: traffic_type
    when: {op: gt, field: confidence, value: 0.8}
    severity: low
    worst_case_severity: none
    fix: Add padding or traffic shaping if traffic analysis matters.
    reference: RFC 4303 (traffic flow confidentiality)
    threat: T6
